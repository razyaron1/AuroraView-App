<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mobile viewport scaling lock -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AuroraView</title>

  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body style="margin:0;padding:0;background-color:#020617;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <div id="root">
      <div id="initial-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div style="text-align:center;">
          <div style="font-size:24px;font-weight:bold;color:#38bdf8;margin-bottom:16px;">AuroraView</div>
          <div style="width:32px;height:32px;border:3px solid #1e293b;border-top-color:#38bdf8;border-radius:50%;margin:0 auto;animation:av-spin 0.8s linear infinite;"></div>
          <p style="color:#94a3b8;font-size:14px;margin-top:12px;">Loading...</p>
        </div>
      </div>
      <style>@keyframes av-spin{to{transform:rotate(360deg);}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
